<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>P-Finder | 智能停車推薦</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 overflow-hidden relative touch-none md:touch-auto antialiased font-sans">

    <div id="nav-header" class="fixed top-3 left-3 right-3 md:left-6 md:right-auto md:w-[366px] z-[4000] bg-slate-900/95 text-white p-3.5 rounded-2xl shadow-[0_12px_40px_rgba(0,0,0,0.15)] flex flex-col gap-2 transition-all duration-300 transform -translate-y-[150%] layer-accelerated">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 flex items-center justify-center bg-blue-500 rounded-xl shrink-0 shadow-sm">
                <span id="nav-arrow" class="text-xl font-bold">⬆️</span>
            </div>
            <div class="flex-1 overflow-hidden">
                <p id="nav-instruction" class="text-sm font-bold leading-tight truncate tracking-wide">計算路徑中...</p>
                <p id="nav-metrics" class="text-[11px] text-slate-400 font-medium tracking-wide mt-0.5">計算中...</p>
            </div>
            <button onclick="stopNavigation()" class="bg-rose-500/20 hover:bg-rose-500/30 text-rose-400 px-3.5 py-2 rounded-xl font-bold transition active:scale-95 text-xs shrink-0 border border-rose-500/20">結束</button>
        </div>
    </div>

    <div id="ui-container" class="absolute top-0 left-0 w-full h-full pointer-events-none flex flex-col md:flex-row z-[2000] overflow-hidden">
        
        <div id="sidebar-wrapper" class="w-full md:w-[390px] h-full flex flex-col shrink-0 md:bg-white md:shadow-[10px_0_40px_rgba(15,23,42,0.04)] relative overflow-hidden md:p-4 md:gap-4">
            
            <div id="search-panel" class="pointer-events-auto bg-white p-4 shadow-[0_8px_30px_rgba(15,23,42,0.06)] md:shadow-none rounded-b-[24px] md:rounded-2xl z-50 transition-transform duration-300 ease-out shrink-0 layer-accelerated border-b md:border border-slate-100">
                <div class="flex justify-between items-center mb-3.5">
                    <div class="flex items-center gap-2">
                        <h1 class="text-2xl font-black text-slate-900 tracking-tight">P-Finder</h1>
                        <span class="text-[10px] bg-blue-50 text-blue-600 font-bold px-1.5 py-0.5 rounded-md border border-blue-100">智能預測</span>
                    </div>
                    <div id="gps-status" class="flex items-center gap-1.5 text-[10px] font-bold text-slate-400 bg-slate-50 px-2.5 py-1 rounded-lg border border-slate-100">
                        GPS <div id="gps-dot" class="w-1.5 h-1.5 bg-rose-500 rounded-full transition-all duration-300"></div>
                    </div>
                </div>
                
                <div class="flex flex-col gap-2.5">
                    <div class="flex gap-2 relative">
                        <div class="relative flex-1">
                            <input type="text" id="searchInput" autocomplete="off" onkeydown="if(event.key === 'Enter') searchLocation()" placeholder="搜尋停車場、地點..." 
                                   class="w-full p-3 bg-slate-50/80 border border-slate-100 rounded-xl text-sm font-medium outline-none focus:border-blue-500 focus:bg-white transition-all">
                            <div id="autocomplete-list" class="absolute left-0 right-0 top-full mt-2 bg-white border border-slate-100 rounded-xl shadow-[0_12px_36px_rgba(0,0,0,0.08)] hidden max-h-[35vh] overflow-y-auto z-[5000] no-scrollbar">
                            </div>
                        </div>
                        <button onclick="searchLocation()" class="bg-blue-600 text-white px-4.5 rounded-xl shadow-sm hover:bg-blue-700 active:scale-95 text-sm font-bold transition-all shrink-0">搜尋</button>
                        <button onclick="clearSearchAndLocate()" class="bg-slate-50 border border-slate-100 w-12 rounded-xl shadow-sm hover:bg-slate-100 active:scale-95 text-base flex items-center justify-center shrink-0 transition-all">📍</button>
                    </div>

                    <div class="flex gap-2">
                        <select id="radiusSelect" onchange="handleFilter()" class="flex-1 p-2.5 bg-slate-50 border border-slate-100 rounded-xl text-xs font-bold text-slate-600 focus:border-blue-500 cursor-pointer shadow-sm appearance-none text-center">
                            <option value="500">📍 500 公尺內</option>
                            <option value="1000" selected>📍 1 公里內</option>
                            <option value="2000">📍 2 公里內</option>
                            <option value="5000">📍 5 公里內</option>
                            <option value="99999">📍 顯示全部</option>
                        </select>
                        
                        <select id="sortSelect" onchange="changeSortMode()" class="flex-1 p-2.5 bg-slate-50 border border-slate-100 rounded-xl text-xs font-bold text-blue-600 focus:border-blue-500 cursor-pointer shadow-sm appearance-none text-center">
                            <option value="distance" selected>✨ 距離最近優先</option>
                            <option value="price">💰 價格便宜優先</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="flex-1 pointer-events-none md:hidden"></div>

            <div id="bottom-sheet" class="pointer-events-auto bg-white rounded-t-[28px] md:rounded-2xl shadow-[0_-10px_35px_rgba(15,23,42,0.05)] md:shadow-none flex flex-col z-30 transition-transform duration-300 ease-out relative md:flex-1 overflow-hidden md:h-0 md:min-h-0 layer-accelerated md:border md:border-slate-100">
                
                <div id="drag-handle" class="w-full h-6 flex justify-center items-center md:hidden cursor-pointer shrink-0" onclick="toggleBottomSheet()">
                    <div class="w-10 h-1 bg-slate-200 rounded-full"></div>
                </div>

                <div class="flex border-b border-slate-100 text-center text-xs font-bold tracking-wider text-slate-400 shrink-0 px-4">
                    <button onclick="switchTab('search')" id="tab-search" class="flex-1 py-3 text-blue-600 border-b-2 border-blue-600 transition-all font-black">附近推薦</button>
                    <button onclick="switchTab('fav')" id="tab-fav" class="flex-1 py-3 border-b-2 border-transparent transition-all font-black">我的收藏</button>
                </div>

                <div id="content-list" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50/40 md:bg-white no-scrollbar pb-12 overscroll-contain">
                    <div class="text-center py-20 text-slate-400 font-medium tracking-wide text-xs">📡 正在同步即時車位資料...</div>
                </div>
            </div>
        </div>
    </div>
    
    <div id="map" class="absolute top-0 left-0 w-full h-full z-[1000]"></div>
    
    <script src="script.js"></script>
</body>
</html>
