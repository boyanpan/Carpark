<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>P-Finder | 智能停車推薦</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 提前套用儲存的日/夜模式，避免畫面閃爍 -->
    <script>
        if (localStorage.getItem('p_theme') === 'dark') {
            document.documentElement.classList.add('theme-dark');
        }
        window.gmapsReady = false;
        window.initMap = function () {
            window.gmapsReady = true;
            if (window.__startApp) window.__startApp();
        };
    </script>
    <!-- Google Maps API（請到 Google Cloud 把這把 Key 限制為你的網域） -->
    <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDCNjrUE7UN9GPqdnVg6ubx13FGQHLHei4&libraries=places,marker,geometry&v=weekly&callback=initMap"></script>
    <script defer src="https://unpkg.com/@googlemaps/markerclusterer/dist/index.min.js"></script>
    <link rel="stylesheet" href="style.css">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="app overflow-hidden relative touch-none md:touch-auto">

    <!-- 街景模式返回列 -->
    <div id="streetview-bar" class="hidden fixed top-4 left-4 right-4 z-[6000] flex items-center justify-between pointer-events-none">
        <button onclick="closeStreetView()" class="sv-back-btn pointer-events-auto px-4 py-2.5 rounded-full shadow-xl font-bold text-sm flex items-center gap-2 transition active:scale-95">
            <span>←</span>
            <span>返回地圖</span>
        </button>
        <div id="streetview-title" class="sv-title-pill pointer-events-auto px-3.5 py-2 rounded-full shadow-lg font-bold text-xs max-w-[55vw] truncate"></div>
    </div>

    <div id="ui-container" class="absolute top-0 left-0 w-full h-full pointer-events-none flex flex-col md:flex-row z-[2000] overflow-hidden">

        <div id="sidebar-wrapper" class="sidebar-shell w-full md:w-[400px] h-full flex flex-col shrink-0 relative overflow-hidden">

            <!-- 搜尋面板 -->
            <div id="search-panel" class="pointer-events-auto rounded-b-3xl md:rounded-none z-50 transition-transform duration-300 ease-in-out shrink-0">
                <!-- 第 1 列：品牌 + 日夜切換 + 記錄停車 + GPS -->
                <div class="panel-head">
                    <h1 class="brand"><span class="brand-mark">P</span>P-Finder</h1>
                    <div class="head-right">
                        <button id="themeBtn" onclick="toggleTheme()" class="theme-btn" title="切換白天 / 夜晚模式" aria-label="切換白天或夜晚模式">🌙</button>
                        <div id="parking-helper-zone">
                            <button id="parkedBtn" onclick="toggleParkedStatus()" class="chip-btn">🚗 記錄停車</button>
                        </div>
                        <div id="gps-status" class="gps-pill">
                            GPS <div id="gps-dot" class="w-2 h-2 bg-red-500 rounded-full"></div>
                        </div>
                    </div>
                </div>

                <!-- 第 2 列：搜尋框 -->
                <div class="search-row relative">
                    <div class="search-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                        <input type="text" id="searchInput" autocomplete="off" onkeydown="if(event.key === 'Enter') searchLocation()" placeholder="搜尋停車場、地點或醫院">
                        <div id="autocomplete-list" class="ac-dropdown absolute left-0 right-0 top-full mt-1 rounded-xl shadow-2xl hidden max-h-[40vh] overflow-y-auto z-[7000]"></div>
                    </div>
                    <button onclick="searchLocation()" class="btn-search shrink-0">搜尋</button>
                </div>

                <!-- 第 3 列：範圍 / 排序 / 語音 / 回到位置 -->
                <div class="filter-row">
                    <select id="radiusSelect" onchange="handleFilter()" aria-label="搜尋範圍">
                        <option value="500">500 公尺內</option>
                        <option value="1000" selected>1 公里內</option>
                        <option value="2000">2 公里內</option>
                        <option value="5000">5 公里內</option>
                        <option value="99999">顯示全部</option>
                    </select>
                    <select id="sortSelect" onchange="changeSortMode()" aria-label="排序方式">
                        <option value="distance" selected>距離最近</option>
                        <option value="price">價格最便宜</option>
                    </select>
                    <button id="voiceBtn" onclick="toggleContinuousVoice()" class="tool-icon-btn w-10 rounded-lg text-lg flex items-center justify-center shrink-0 transition" title="開啟免持語音控制" aria-label="語音控制">🎙️</button>
                    <button id="locateBtn" onclick="clearSearchAndLocate()" class="tool-icon-btn w-10 rounded-lg text-lg flex items-center justify-center shrink-0 transition" title="清除搜尋並回到目前位置" aria-label="回到目前位置">📍</button>
                </div>

                <div id="parkedTimerPanel" class="timer-panel hidden flex-col">
                    <div class="flex justify-between items-center">
                        <span class="timer-title font-extrabold">⏰ 愛車計時</span>
                        <button onclick="clearParkedStatus()" class="timer-clear font-bold text-[11px] px-2.5 py-1 rounded-lg">清除紀錄</button>
                    </div>
                    <div class="timer-grid">
                        <div>停放時間<span id="parkedTimeDisplay" class="num">0 分鐘</span></div>
                        <div>預估費用<span id="parkedCostDisplay" class="num cost">$0 元</span></div>
                    </div>
                    <button id="navToCarBtn" onclick="navToMyCar()" class="pk-go pk-go-wide" style="margin-top:0">Google 導航回愛車</button>
                </div>
            </div>

            <div class="flex-1 pointer-events-none md:hidden"></div>

            <!-- 停車場清單（手機為底部抽屜） -->
            <div id="bottom-sheet" class="pointer-events-auto rounded-t-[1.75rem] md:rounded-none flex flex-col z-30 transition-transform duration-300 ease-in-out relative md:flex-1 overflow-hidden md:h-0 md:min-h-0">
                <div id="drag-handle" class="w-full h-8 flex justify-center items-center md:hidden cursor-pointer shrink-0" onclick="toggleBottomSheet()">
                    <svg id="sheet-arrow" class="transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-label="展開或收合清單">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 15l7-7 7 7"></path>
                    </svg>
                </div>

                <div class="tabs">
                    <button onclick="switchTab('search')" id="tab-search" class="tab-active">附近推薦</button>
                    <button onclick="switchTab('fav')" id="tab-fav" class="tab-inactive">我的收藏</button>
                </div>

                <div id="content-list" class="flex-1 overflow-y-auto p-3 space-y-2.5 no-scrollbar pb-12 overscroll-contain">
                    <div class="pk-empty animate-pulse">正在讀取即時車位…</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 地圖 -->
    <div id="map" class="absolute top-0 left-0 w-full h-full z-[1000]"></div>

    <!-- 回到我的位置 -->
    <button onclick="panToUserLocation()" id="recenter-btn" title="回到我的位置" aria-label="回到我的位置"
        class="recenter-fab fixed right-5 bottom-8 z-[3000] w-12 h-12 rounded-full flex items-center justify-center text-xl cursor-pointer">
        🎯
    </button>

    <!-- 停車場詳細資訊彈窗（Bento 儀表板風格） -->
    <div id="detail-modal" onclick="closeDetailModal()" class="modal-backdrop hidden fixed inset-0 z-[5000] flex items-end md:items-center justify-center p-0 md:p-4 pointer-events-auto">
        <div id="detail-modal-card" onclick="event.stopPropagation()" class="modal-card w-full max-w-[440px] max-h-[88vh] rounded-t-3xl md:rounded-3xl shadow-2xl flex flex-col overflow-hidden">
            <!-- 由 script.js 動態填入內容 -->
        </div>
    </div>

    <script defer src="script.js"></script>
</body>
</html>
