<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>P-Finder | 智能停車推薦</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 overflow-hidden relative touch-none md:touch-auto antialiased">

    <div id="nav-header" class="fixed top-0 left-0 right-0 z-[4000] bg-blue-600 text-white p-3.5 shadow-xl flex flex-col gap-2 transition-transform duration-300 transform -translate-y-full layer-accelerated">
        <div class="flex items-center gap-3">
            <div class="w-11 h-11 flex items-center justify-center bg-white/20 rounded-xl border border-white/20 shrink-0">
                <span id="nav-arrow" class="text-2xl font-bold">⬆️</span>
            </div>
            <div class="flex-1 overflow-hidden">
                <p id="nav-instruction" class="text-sm font-bold leading-tight truncate">計算路徑中...</p>
                <p id="nav-metrics" class="text-[11px] opacity-80 font-mono tracking-wide mt-0.5">計算中...</p>
            </div>
            <button onclick="stopNavigation()" class="bg-rose-500 hover:bg-rose-600 px-3 py-2 rounded-lg font-bold shadow-sm transition active:scale-95 text-xs shrink-0">結束<br>導航</button>
        </div>
    </div>

    <div id="ui-container" class="absolute top-0 left-0 w-full h-full pointer-events-none flex flex-col md:flex-row z-[2000] overflow-hidden">
        
        <div id="sidebar-wrapper" class="w-full md:w-[390px] h-full flex flex-col shrink-0 md:bg-white md:shadow-[6px_0_30px_rgba(15,23,42,0.08)] relative overflow-hidden">
            
            <div id="search-panel" class="pointer-events-auto bg-white/95 md:bg-white p-4 shadow-md md:shadow-none rounded-b-2xl md:rounded-none z-50 transition-transform duration-300 ease-out shrink-0 layer-accelerated border-b border-slate-100">
                <div class="flex justify-between items-center mb-3">
                    <h1 class="text-2xl font-black text-blue-600 italic tracking-tighter">P-Finder</h1>
                    <div id="gps-status" class="flex items-center gap-1.5 text-[10px] font-bold text-slate-500 bg-slate-50 px-2.5 py-1 rounded-md border border-slate-100">
                        GPS <div id="gps-dot" class="w-2 h-2 bg-red-500 rounded-full transition-all duration-300"></div>
                    </div>
                </div>
                
                <div class="flex flex-col gap-2.5">
                    <div class="flex gap-2 relative">
                        <div class="relative flex-1">
                            <input type="text" id="searchInput" autocomplete="off" onkeydown="if(event.key === 'Enter') searchLocation()" placeholder="搜尋停車場、地點..." 
                                   class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:border-blue-500 focus:bg-white transition-all shadow-inner">
                            <div id="autocomplete-list" class="absolute left-0 right-0 top-full mt-1.5 bg-white border border-slate-200 rounded-xl shadow-2xl hidden max-h-[35vh] overflow-y-auto z-[5000] no-scrollbar">
                            </div>
                        </div>
                        <button onclick="searchLocation()" class="bg-blue-600 text-white px-4 rounded-xl shadow-md hover:bg-blue-700 active:scale-95 text-sm font-bold transition-all shrink-0">搜尋</button>
                        <button onclick="clearSearchAndLocate()" class="bg-white border border-slate-200 w-11 rounded-xl shadow-sm hover:bg-slate-50 active:scale-95 text-lg flex items-center justify-center shrink-0 transition-all">📍</button>
                    </div>

                    <div class="flex gap-2.5">
                        <select id="radiusSelect" onchange="handleFilter()" class="flex-1 p-2 bg-slate-50 border border-slate-200 rounded-xl text-xs outline-none font-bold text-slate-600 focus:border-blue-500 cursor-pointer shadow-sm">
                            <option value="500">📍 500 公尺內</option>
                            <option value="1000" selected>📍 1 公里內</option>
                            <option value="2000">📍 2 公里內</option>
                            <option value="5000">📍 5 公里內</option>
                            <option value="99999">📍 顯示全部</option>
                        </select>
                        
                        <select id="sortSelect" onchange="changeSortMode()" class="flex-1 p-2 bg-blue-50 border border-blue-100 rounded-xl text-xs outline-none font-black text-blue-600 focus:border-blue-500 cursor-pointer shadow-sm">
                            <option value="distance" selected>✨ 推薦：距離最近</option>
                            <option value="price">💰 推薦：價格最便宜</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="flex-1 pointer-events-none md:hidden"></div>

            <div id="bottom-sheet" class="pointer-events-auto bg-white/95 md:bg-white rounded-t-[24px] md:rounded-none shadow-[0_-10px_30px_rgba(15,23,42,0.06)] md:shadow-none flex flex-col z-30 transition-transform duration-300 ease-out relative md:flex-1 overflow-hidden md:h-0 md:min-h-0 layer-accelerated">
                <div id="drag-handle" class="w-full h-7 flex justify-center items-center md:hidden cursor-pointer shrink-0" onclick="toggleBottomSheet()">
                    <div class="w-12 h-1 bg-slate-300 rounded-full"></div>
                </div>

                <div class="flex border-b border-slate-100 text-center text-sm font-bold text-slate-400 shrink-0">
                    <button onclick="switchTab('search')" id="tab-search" class="flex-1 py-3 text-blue-600 border-b-2 border-blue-600 tracking-wide transition-all">附近推薦</button>
                    <button onclick="switchTab('fav')" id="tab-fav" class="flex-1 py-3 border-b-2 border-transparent tracking-wide transition-all">我的收藏</button>
                </div>

                <div id="content-list" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50/60 md:bg-white no-scrollbar pb-12 overscroll-contain">
                    <div class="text-center py-20 text-slate-400 font-bold tracking-wide text-xs">📡 正在連接雲端資料庫...</div>
                </div>
            </div>
        </div>
    </div>
    
    <div id="map" class="absolute top-0 left-0 w-full h-full z-[1000]"></div>
    
    <script src="script.js"></script>
</body>
</html>
